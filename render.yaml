services:
  - type: web
    name: saath
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: NODE_ENV
        value: production
      - key: TAVUS_API_KEY
        sync: false
      - key: TAVUS_PAL_ID
        value: p92c2102d569
      - key: TAVUS_DEPLOYMENT_ID
        value: 4662c7b4-f80b-4a73-ad5d-eb8468c89dab
      - key: PUBLIC_ORIGIN
        sync: false
